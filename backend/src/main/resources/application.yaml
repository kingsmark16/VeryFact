spring:
  application:
    name: veryfact
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 22MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:veryfact}}
    username: ${POSTGRES_USER:veryfact}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

veryfact:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    request-timeout: ${GEMINI_REQUEST_TIMEOUT:60s}
  factcheck:
    api-key: ${GOOGLE_FACTCHECK_API_KEY:}
  search:
    provider: ${GOOGLE_SEARCH_PROVIDER:serpapi}
    serpapi:
      api-key: ${SERPAPI_API_KEY:}
  ratelimit:
    requests-per-hour: ${RATE_LIMIT_PER_HOUR:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
server:
  port: ${PORT:8080}
