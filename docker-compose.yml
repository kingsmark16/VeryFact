services:
  db:
    image: postgres:18
    container_name: veryfact-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veryfact}
      POSTGRES_USER: ${POSTGRES_USER:-veryfact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: veryfact-backend
    profiles: ["fullstack"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-veryfact}
      POSTGRES_USER: ${POSTGRES_USER:-veryfact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GOOGLE_FACTCHECK_API_KEY: ${GOOGLE_FACTCHECK_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: veryfact-frontend
    profiles: ["fullstack"]
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
